[project]
name = "expirymanager"
version = "1.0.0"
description = "Zero-config Fyers expired F&O data platform"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

# Every version is pinned exactly. This app talks to one broker API and stores years of market
# data on disk, so a silent minor bump in a serialisation or crypto dependency is a data problem,
# not a convenience problem.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy==2.0.52",
    "duckdb==1.5.5",
    "pyarrow==25.0.1",
    "httpx==0.28.1",
    "apscheduler==3.11.3",
    "cryptography==50.0.1",
    "argon2-cffi==25.1.0",
    "limits==5.8.0",
    "secure==2.0.1",
    "sse-starlette==3.4.11",
    "keyring==25.7.0",
]

[project.scripts]
expirymanager = "expirymanager.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["expirymanager"]

# Superseded by pytest.ini once W28 lands: pytest.ini wins over pyproject when both exist.
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
